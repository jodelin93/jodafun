<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Joda Fun mark: a face-down card behind a face-up "J" card on the felt table -->
  <defs>
    <pattern id="lattice" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#155247"/>
      <rect width="1.4" height="6" fill="#FFC23D" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0E3B34"/>
  <g transform="rotate(-14 22 34)">
    <rect x="9" y="15" width="26" height="36" rx="4" fill="#FFFDF9"/>
    <rect x="12" y="18" width="20" height="30" rx="2.5" fill="url(#lattice)"/>
  </g>
  <g transform="rotate(8 40 32)">
    <rect x="27" y="12" width="26" height="36" rx="4" fill="#FFFDF9"/>
    <text x="40" y="38.5" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="21" font-weight="900" fill="#FF5C4D">J</text>
  </g>
</svg>
